<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diablo II — Item Sets Compendium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="sets-styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════ HEADER ══ -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-title-block">
        <div class="header-sigil">✦</div>
        <div>
          <h1 class="site-title">Item Sets Compendium</h1>
          <p class="site-subtitle">Diablo II: Resurrected — Including Reign of the Warlock (2026)</p>
        </div>
      </div>
      <nav class="site-nav">
        <a href="index.html" class="nav-link">Runewords</a>
        <a href="sets.html" class="nav-link active">Item Sets</a>
      </nav>
    </div>
  </header>

  <!-- ═══════════════════════════════════ FILTERS ══ -->
  <section class="filters-section">
    <div class="filters-inner">

      <!-- Search + Stats -->
      <div class="filter-block filter-search-block">
        <label class="filter-label">Search</label>
        <div class="search-stats-row">
          <input type="text" id="searchInput" class="search-input" placeholder="Set name, item, or stat..." autocomplete="off" />
          <div class="header-stats" id="headerStats">
            <span class="stat-pill" id="statTotal">— sets</span>
            <span class="stat-pill" id="statShown">— shown</span>
          </div>
        </div>
      </div>

      <!-- Tier filter -->
      <div class="filter-block">
        <label class="filter-label">Tier</label>
        <div class="pill-group" id="tierFilter">
          <button class="pill active" data-tier="all">All</button>
          <button class="pill" data-tier="Normal">Normal</button>
          <button class="pill" data-tier="Exceptional">Exceptional</button>
          <button class="pill" data-tier="Elite">Elite</button>
        </div>
      </div>

      <!-- Class filter -->
      <div class="filter-block">
        <label class="filter-label">Class</label>
        <div class="pill-group" id="classFilter">
          <button class="pill active" data-class="all">All</button>
          <button class="pill" data-class="Any">Any Class</button>
          <button class="pill" data-class="Amazon">Amazon</button>
          <button class="pill" data-class="Assassin">Assassin</button>
          <button class="pill" data-class="Barbarian">Barbarian</button>
          <button class="pill" data-class="Druid">Druid</button>
          <button class="pill" data-class="Necromancer">Necromancer</button>
          <button class="pill" data-class="Paladin">Paladin</button>
          <button class="pill" data-class="Sorceress">Sorceress</button>
        </div>
      </div>

      <!-- Source + Ladder on one line -->
      <div class="filter-block filter-source-ladder-row">
        <div class="source-ladder-group">
          <label class="filter-label">Source</label>
          <div class="pill-group" id="patchFilter">
            <button class="pill active" data-patch="all">All</button>
            <button class="pill" data-patch="original">Classic / LoD</button>
            <button class="pill" data-patch="2.6">Patch 2.6</button>
            <button class="pill" data-patch="2026">⚔ Reign of the Warlock</button>
          </div>
        </div>
        <div class="source-ladder-group">
          <label class="filter-label">Ladder</label>
          <div class="pill-group" id="ladderFilter">
            <button class="pill active" data-ladder="all">All</button>
            <button class="pill" data-ladder="false">Non-Ladder</button>
            <button class="pill" data-ladder="true">Ladder Only</button>
          </div>
        </div>
      </div>

      <div class="filter-actions">
        <button class="reset-btn" id="resetBtn">↺ Reset All Filters</button>
      </div>

    </div>
  </section>

  <!-- ═══════════════════════════════════ RESULTS ══ -->
  <main class="results-section">
    <div id="setsGrid"></div>
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">✦</div>
      <p>No sets match your current filters.</p>
      <button class="reset-btn" onclick="resetAll()">Reset Filters</button>
    </div>
  </main>

  <!-- ═══════════════════════════════════ MODAL ══ -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Data sourced from Diablo II: Resurrected v3.1 — Reign of the Warlock. Fan-made reference tool.</p>
  </footer>

  <script src="sets-data.js"></script>
  <script src="sets-app.js"></script>
</body>
</html>
