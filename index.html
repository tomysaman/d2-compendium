<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diablo II — Runeword Compendium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════ HEADER ══ -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-title-block">
        <div class="header-sigil">⛧</div>
        <div>
          <h1 class="site-title">Runeword Compendium</h1>
          <p class="site-subtitle">Diablo II: Resurrected — Including Reign of the Warlock (2026)</p>
        </div>
      </div>

    </div>
  </header>

  <!-- ═══════════════════════════════════════════ FILTERS ══ -->
  <section class="filters-section">
    <div class="filters-inner">

      <!-- Search + Stats row -->
      <div class="filter-block filter-search-block">
        <label class="filter-label">Search</label>
        <div class="search-stats-row">
          <input type="text" id="searchInput" class="search-input" placeholder="Name or stat..." autocomplete="off" />
          <div class="header-stats" id="headerStats">
            <span class="stat-pill" id="statTotal">— runewords</span>
            <span class="stat-pill" id="statShown">— shown</span>
            <button class="rune-view-toggle" id="runeViewToggle" title="Toggle rune display">
              <span class="toggle-icon-text">Aa</span>
              <span class="toggle-icon-img">⬡</span>
              <span class="toggle-label" id="toggleLabel">Show Icons</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Category -->
      <div class="filter-block">
        <label class="filter-label">Item Type</label>
        <div class="pill-group" id="categoryFilter"></div>
      </div>

      <!-- Sockets -->
      <div class="filter-block">
        <label class="filter-label">Sockets</label>
        <div class="pill-group" id="socketFilter">
          <button class="pill active" data-socket="all">Any</button>
          <button class="pill" data-socket="2">2</button>
          <button class="pill" data-socket="3">3</button>
          <button class="pill" data-socket="4">4</button>
          <button class="pill" data-socket="5">5</button>
          <button class="pill" data-socket="6">6</button>
        </div>
      </div>

      <!-- Rune Finder -->
      <div class="filter-block filter-rune-block">
        <label class="filter-label">Find by Runes <span class="filter-label-sub">— 1 rune: all runewords containing it &nbsp;·&nbsp; 2+ runes: must contain all selected</span></label>
        <div class="rune-grid" id="runeGrid"></div>
        <button class="clear-runes-btn" id="clearRunesBtn">Clear Runes</button>
      </div>

      <!-- Patch / Ladder — single row -->
      <div class="filter-block filter-source-ladder-row">
        <div class="source-ladder-group">
          <label class="filter-label">Source</label>
          <div class="pill-group" id="patchFilter">
            <button class="pill active" data-patch="all">All</button>
            <button class="pill" data-patch="classic">Classic / LoD</button>
            <button class="pill" data-patch="2.4">Patch 2.4</button>
            <button class="pill" data-patch="2026">⚔ Reign of the Warlock</button>
          </div>
        </div>
        <div class="source-ladder-group">
          <label class="filter-label">Ladder</label>
          <div class="pill-group" id="ladderFilter">
            <button class="pill active" data-ladder="all">All</button>
            <button class="pill" data-ladder="false">Non-Ladder</button>
            <button class="pill" data-ladder="true">Ladder Only</button>
          </div>
        </div>
      </div>

      <div class="filter-actions">
        <button class="reset-btn" id="resetBtn">↺ Reset All Filters</button>
      </div>

    </div>
  </section>

  <!-- ═══════════════════════════════════════════ RESULTS ══ -->
  <main class="results-section">
    <div class="sort-bar">
      <span class="sort-label">Sort by:</span>
      <button class="sort-btn active" data-sort="category">Category</button>
      <button class="sort-btn" data-sort="level">Required Level</button>
      <button class="sort-btn" data-sort="name">Name</button>
      <button class="sort-btn" data-sort="sockets">Sockets</button>
    </div>

    <div id="runewordGrid" class="runeword-grid"></div>
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">⛧</div>
      <p>No runewords match your current filters.</p>
      <button class="reset-btn" onclick="resetAll()">Reset Filters</button>
    </div>
  </main>

  <!-- ═══════════════════════════════════════════ MODAL ══ -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Data sourced from Diablo II: Resurrected v3.1 — Reign of the Warlock. Fan-made reference tool.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
