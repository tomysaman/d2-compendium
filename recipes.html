<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diablo II — Horadric Cube Recipes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="sets-styles.css" />
  <link rel="stylesheet" href="recipes-styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════ HEADER ══ -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-title-block">
        <div class="header-sigil">⬡</div>
        <div>
          <h1 class="site-title">Horadric Cube Recipes</h1>
          <p class="site-subtitle">Diablo II: Resurrected — Including Reign of the Warlock (2026)</p>
        </div>
      </div>
      <nav class="site-nav">
        <a href="index.html" class="nav-link">Runewords</a>
        <a href="sets.html" class="nav-link">Item Sets</a>
        <a href="recipes.html" class="nav-link active">Cube Recipes</a>
      </nav>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════ FILTERS ══ -->
  <section class="filters-section">
    <div class="filters-inner">

      <!-- Search + Stats -->
      <div class="filter-block filter-search-block">
        <label class="filter-label">Search</label>
        <div class="search-stats-row">
          <input type="text" id="searchInput" class="search-input" placeholder="Recipe name, ingredient, or result..." autocomplete="off" />
          <div class="header-stats" id="headerStats">
            <span class="stat-pill" id="statTotal">— recipes</span>
            <span class="stat-pill" id="statShown">— shown</span>
          </div>
        </div>
      </div>

      <!-- Category filter -->
      <div class="filter-block">
        <label class="filter-label">Category</label>
        <div class="pill-group" id="categoryFilter">
          <button class="pill active" data-category="all">All</button>
          <button class="pill" data-category="runes">Runes</button>
          <button class="pill" data-category="socketing">Socketing</button>
          <button class="pill" data-category="upgrade">Item Upgrades</button>
          <button class="pill" data-category="reroll">Rerolling</button>
          <button class="pill" data-category="crafting">Crafting</button>
          <button class="pill" data-category="jewelry">Jewelry</button>
          <button class="pill" data-category="respec">Respec</button>
          <button class="pill" data-category="quest">Quest</button>
          <button class="pill" data-category="misc">Misc</button>
        </div>
      </div>

      <!-- Source + Ladder on one line -->
      <div class="filter-block filter-source-ladder-row">
        <div class="source-ladder-group">
          <label class="filter-label">Source</label>
          <div class="pill-group" id="patchFilter">
            <button class="pill active" data-patch="all">All</button>
            <button class="pill" data-patch="classic">Classic / LoD</button>
            <button class="pill" data-patch="2.4">Patch 2.4</button>
            <button class="pill" data-patch="2.6">Patch 2.6</button>
            <button class="pill" data-patch="2026">⚔ Reign of the Warlock</button>
          </div>
        </div>
        <div class="source-ladder-group">
          <label class="filter-label">Ladder</label>
          <div class="pill-group" id="ladderFilter">
            <button class="pill active" data-ladder="all">All</button>
            <button class="pill" data-ladder="false">Non-Ladder</button>
            <button class="pill" data-ladder="true">Ladder Only</button>
          </div>
        </div>
      </div>

      <div class="filter-actions">
        <button class="reset-btn" id="resetBtn">↺ Reset All Filters</button>
      </div>

    </div>
  </section>

  <!-- ═══════════════════════════════════════════ RESULTS ══ -->
  <main class="results-section">
    <div class="sort-bar">
      <span class="sort-label">Sort by:</span>
      <button class="sort-btn active" data-sort="category">Category</button>
      <button class="sort-btn" data-sort="name">Name</button>
    </div>

    <div id="recipesGrid"></div>
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">⬡</div>
      <p>No recipes match your current filters.</p>
      <button class="reset-btn" onclick="resetAll()">Reset Filters</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>Data sourced from Diablo II: Resurrected v3.1 — Reign of the Warlock. Fan-made reference tool.</p>
  </footer>

  <script src="recipes-data.js"></script>
  <script src="recipes-app.js"></script>
</body>
</html>
